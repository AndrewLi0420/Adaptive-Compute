[project]
name = "adaptive-compute"
version = "0.1.0"
description = "Resource-aware local compute runtime for ML workloads"
requires-python = ">=3.12"
dependencies = [
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
adaptive-compute = "adaptive_compute.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["adaptive_compute*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes seconds and touches real system timing"]
